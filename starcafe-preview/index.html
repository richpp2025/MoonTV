</script><script>/* 星灯魔女咖啡馆 - 可执行完整离线 UI，零网络依赖 */
(()=>{'use strict';
const C=window.StarCafeCore, root=document.getElementById('game'), toast=document.getElementById('toast');
const KEY='starcafe.save.v2', ARCHIVE='starcafe.endings.v2';let state=null,archive=[],saveAvailable=true,toaster=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const st=localStorage.getItem(KEY),arc=localStorage.getItem(ARCHIVE);if(st){state=C.validate(JSON.parse(st))}if(arc){let a=JSON.parse(arc);if(Array.isArray(a))archive=a.filter(v=>typeof v==='string').slice(0,40)}}catch(e){console.warn('无法恢复存档',e);saveAvailable=false;state=null}}
function save(){try{if(state)localStorage.setItem(KEY,JSON.stringify(C.validate(state)));else localStorage.removeItem(KEY);localStorage.setItem(ARCHIVE,JSON.stringify(archive));saveAvailable=true}catch(e){saveAvailable=false;console.warn('本地存储不可用',e)}}
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toaster);toaster=setTimeout(()=>toast.classList.remove('show'),2600)}
function act(fn,scroll=false){try{const prev=state&&state.phase;state=fn(state);if(state.phase==='ending'&&prev!=='ending'){if(!archive.includes(state.outcome.id))archive.push(state.outcome.id)}save();render();if(scroll){document.documentElement.scrollTop=0;document.body.scrollTop=0}}catch(e){notify(e.message||'操作失败')}}
function header(){const isTitle=!state;return `<header class="header"><div class="brand"><span class="brand-logo">✦</span><div><h1>星灯魔女咖啡馆</h1><small>七日经营 · 魔法小镇</small></div></div><div class="head-right">${isTitle?'':`<span class="daychip">第 ${state.day+1} / 7 天</span><button class="tinybtn" data-act="export" title="导出存档">存档</button><button class="tinybtn" data-act="restart" title="重新开始">↻</button>`}</div></header>`}
function statbar(){if(!state)return '';let items=[['金币',state.cash],['口碑',state.rep],['信任',state.trust],['名气',state.fame]];return `<div class="progress"><span style="width:${(state.day+1)/7*100}%"></span></div><div class="stats">${items.map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join('')}</div>`}
function portrait(){if(!window.StarPortrait)return '';let who='aster',outfit='gown',acc='ribbon';if(state){if(state.phase==='selling'||state.phase==='report'){who='aqua';outfit='casual';acc='ribbon'}else if(state.phase==='evening'&&state.day===1){who='rose';outfit='royal';acc='crown'}else if(state.phase==='ending'){who=state.outcome.id==='lost'?'aqua':'aster';outfit=state.outcome.id==='legend'?'royal':'gown';acc='crown'}}return `<div class="portrait">${window.StarPortrait(who,outfit,{acc})}</div>`}
function hero(){const title=state?'第 '+(state.day+1)+' 天 · '+C.DAY[state.day].title:'只剩七天，她的店就没了';const text=state?({morning:'你做的每个决定，都会影响今晚的金币和人物关系。',prepare:'预测需求、进货、定价，准备迎接今天的客人。',selling:'每一笔成交都真实影响现金和库存。',report:'结算利润，选择是否投资永久升级。',evening:'选择故事走向，影响明天的机会。',ending:'你的经营决定了七天之后的结局。'})[state.phase]:'继承一家濒临抵押的魔女咖啡馆，七天内筹足至少 590 枚金币。';return `<div class="hero"><span class="moon"></span><span class="twinkle a">✧</span><span class="twinkle b">✦</span><span class="twinkle c">✧</span>${portrait()}<div class="hero-copy"><div class="kicker">✦ 星光与魔法 ✦</div><h2>${esc(title)}</h2><p>${esc(text)}</p></div></div>`}
function footer(){return `<footer class="foot"><div><button class="tinybtn" style="color:#71537b;background:#fff5fc;margin-bottom:9px" data-act="import">导入存档 JSON</button><input id="starSaveInput" type="file" accept="application/json,.json" style="display:none" /></div>独立原创试玩版 · 完全离线 · 不含真实广告或内购<br/>${saveAvailable?'进度自动保存在当前浏览器':'当前环境存储不可用：请使用“存档”导出备份'} · 非 TapTap Maker 构建</footer>`}
function cardOption(index,o,actName,enabled=true){let delta=Object.entries(o.d||{}).map(([k,v])=>{if(!v)return '';return `${({cash:'金币',rep:'口碑',trust:'信任',fame:'名气'})[k]||k} ${v>0?'+':''}${v}`}).filter(Boolean).join('　');return `<button class="option" data-act="${actName}" data-i="${index}" ${enabled?'':'disabled'}><strong>${esc(o.name)} <span>➜</span></strong><span>${esc(o.desc)}</span>${delta?`<span class="small">${esc(delta)}</span>`:''}${enabled?'':'<span class="no">金币或条件不足</span>'}</button>`}
function titlePage(){const seen=archive.length?`<div class="hint">已解锁 ${archive.length} / 4 种结局。重新选择可以体验不同的人物关系和经营结果。</div>`:'';return `<div class="content"><span class="tag gold">已具备首页→经营→结局→重开全流程</span><h2 class="heading" style="margin-top:12px">七天拯救星灯咖啡馆</h2><p class="sub">原创二次元经营小故事。你接手了即将被收走的店铺，合伙人莉娅愿意与你再试七天。不是点击领取金币：必须进货、定价、卖出商品才能攒够还款。</p><div class="story highlight"><b>七日挑战</b><br/>还款额 <b>${C.DEBT} 枚金币</b>。你可以投资新品、改善口碑、扩大货架，也可以冒险追求高利润。最终会根据资金、口碑与莉娅的信任获得不同结局。</div><div class="actions"><button class="button full" data-act="start">开始新的一局 ✨</button></div><div class="actions" style="margin-top:10px"><button class="button alt full" data-act="import">载入以前导出的存档 JSON</button></div>${seen}<div class="hint">玩法完整：每天上午选策略 → 进货定价 → 接待客人 → 查看日结和升级 → 夜间故事事件。全程约 10–20 分钟；可以一键完成当天顾客接待。</div><p class="small">人物为原创 AI 矢量插画；首版没有联网服务、真实广告 SDK、支付或正式发布功能。</p></div>`}
function morning(){const d=C.DAY[state.day],p=C.DAY_PLANS[state.day];return `<div class="content"><span class="tag">故事进度 ${state.day+1}/7</span><h2 class="heading">今天先做什么？</h2><div class="story"><b>${esc(d.title)} · ${esc(d.tag)}</b><br/>${esc(p.intro)}${state.lastResult?`<div class="separator"></div><span class="small">昨夜：${esc(state.lastResult)}</span>`:''}</div><div class="hint">今日客流预测：${esc(d.forecast)}</div><p class="sub">选择一项早晨策略。它将影响客流、顾客可接受的价格或后续口碑。</p>${p.options.map((o,i)=>cardOption(i,o,'plan',state.cash+(o.d.cash||0)>=0)).join('')}<p class="small">即使暂时没有金币，也能选择部分低成本策略继续营业。</p></div>`}
function goodsCards(){return `<div class="product-grid">${C.GOODS.map(g=>{let unit=C.cost(state,g.id),stock=state.stock[g.id];return `<div class="product"><span class="product-icon">${g.icon}</span><div class="product-name">${esc(g.name)}</div><small>成本 ${unit} · 库存 ${stock}</small><p>${esc(g.desc)}</p><div class="control-name">进货（可撤销）</div><div class="stepper"><button data-act="refund" data-id="${g.id}" ${state.boughtToday[g.id]<=0?'disabled':''} aria-label="撤销一件${g.name}">−</button><strong>${stock}</strong><button data-act="buy" data-id="${g.id}" ${state.cash<unit||C.stockCount(state)>=state.capacity?'disabled':''} aria-label="进一件${g.name}">+</button></div><div class="control-name">售 价</div><div class="stepper"><button data-act="priceDown" data-id="${g.id}" ${state.prices[g.id]<=g.min?'disabled':''}>−</button><strong>${state.prices[g.id]}</strong><button data-act="priceUp" data-id="${g.id}" ${state.prices[g.id]>=g.max?'disabled':''}>+</button></div><small class="control-hint">建议 ${g.price} · 上限 ${g.max}</small></div>`}).join('')}</div>`}
function prepare(){return `<div class="content"><span class="tag gold">第 ${state.day+1} 天 · 开店准备</span><h2 class="heading">进货与定价</h2><p class="sub">采购要花真金币，卖不出去会压住资金。价格高有利润，也可能让客人转身离开。<b>未售出的商品会保留到下一天。</b></p><div class="panel row"><div><div class="panel-title">本店货架</div><div class="small">当前库存 ${C.stockCount(state)} / ${state.capacity} 件</div></div><span class="tag">剩余金币 ${state.cash}</span></div>${goodsCards()}${state.cash<8&&C.stockCount(state)===0?'<div class="panel"><div class="panel-title">现金见底？</div><p class="sub">应急周转：立刻得到 45 枚，但最终需多还 75 枚，并失去少量口碑与信任。</p><button class="button alt full" data-act="borrow">申请应急周转 +45</button></div>':''}<div class="hint">今日预测：${esc(C.DAY[state.day].forecast)}<br/>你可以调整售价，决定要不要用更高的利润换取更少成交。</div><div class="actions"><button class="button alt" data-act="suggest" ${C.stockCount(state)>=state.capacity?'disabled':''}>一键建议补货</button><button class="button" data-act="open" ${C.stockCount(state)===0?'disabled':''}>正式开门营业 →</button></div></div>`}
function shelf(){return `<div class="shelf-line">${C.GOODS.map(g=>`<div class="shelf-item">${g.icon}<small>${state.stock[g.id]} 件</small><small>售 ${state.prices[g.id]}</small></div>`).join('')}</div>`}
function receipt(x){const good=x.result==='sold';return `<li><span class="result-pill ${good?'':'bad'}">${good?'成交':'错过'}</span>　${esc(x.name)}：${esc(x.goodName)}，${good?`售出 ${x.price} 金币`:x.result==='stockout'?'没货了':`标价 ${x.price} 高于预算 ${x.budget}`}</li>`}
function selling(){const n=state.customers.length,i=state.customerIndex,prev=state.sales.at(-1),next=state.customers[i],oldRevenue=state.sales.filter(x=>x.result==='sold').reduce((a,b)=>a+b.price,0);return `<div class="content"><span class="tag gold">第 ${state.day+1} 天 · 正在营业</span><h2 class="heading">客人陆续到来了</h2><p class="sub">你已经决定了今天的库存和价格。查看哪些顾客买单，以及哪些需求被错过。</p>${shelf()}<div class="panel row"><div><div class="panel-title">当前成交 ${state.sales.filter(x=>x.result==='sold').length} / ${i} 人</div><div class="small">今日已收款 ${oldRevenue} 金币</div></div><span class="tag">客人 ${i+1}/${n}</span></div>${next?`<div class="visit"><b>🔔 ${esc(next.name)}</b><br/>客人正走向货架。你想观察成交过程，还是一键结算本日？</div>`:''}${prev?`<div class="story">上一位：${esc(prev.name)} · <b>${prev.result==='sold'?`成功售出 ${prev.goodName}，收到 ${prev.price} 金币`:prev.result==='stockout'?`${prev.goodName} 售罄，没能成交`:`${prev.goodName} 定价偏高，客人没有购买`}</b></div>`:''}<div class="actions"><button class="button alt" data-act="serve">接待下一位</button><button class="button" data-act="auto">一键接待剩余 →</button></div><div class="panel"><div class="panel-title">今日收银记录</div><ol class="sale-list">${state.sales.length?state.sales.slice().reverse().map(receipt).join(''):'<li>今日第一位顾客即将进店……</li>'}</ol></div></div>`}
function report(){const r=state.reports.at(-1);const upgradeItems=[['shelf','扩大货架','容量 +5，能同时卖更多商品',72],['recipe','升级魔法炉','蛋糕、特调进货成本每件 -2',58],['deco','翻新店面','口碑 +7，名气 +5',52]];return `<div class="content"><span class="tag">第 ${state.day+1} 天 · 营业结算</span><h2 class="heading">今天的努力有回报吗？</h2><p class="sub">进货不等于亏损：没卖完的货仍在库存；只有销售额扣掉商品成本才是毛利。这里同时单列了每日营运支出。</p><div class="summary-grid"><div class="sum-box"><small>今日销售收入</small><strong>+${r.revenue}</strong></div><div class="sum-box"><small>成交 / 来客</small><strong>${r.sold} / ${r.customers}</strong></div><div class="sum-box"><small>期末现金</small><strong>${state.cash}</strong></div><div class="sum-box"><small>剩余库存估值</small><strong>${C.stockValue(state)}</strong></div></div><div class="hint">本日固定营运费 −${r.wages} 金币。最终还债看现金和剩余商品价值，不把销售额误当净利润。</div><div class="panel"><div class="panel-title">永久升级 · 决定未来经营能力</div>${upgradeItems.map(([id,title,desc,price])=>`<div class="upgrade"><div><strong>${title}</strong><small>${desc}</small></div><button class="button alt" data-act="upgrade" data-id="${id}" ${state.upgrades[id]||state.cash<price?'disabled':''}>${state.upgrades[id]?'已升级':`−${price} 金币`}</button></div>`).join('')}</div><div class="panel"><div class="panel-title">今日客人反馈</div><ol class="sale-list">${state.sales.map(receipt).join('')}</ol></div><button class="button full" data-act="evening">收工，进入夜间事件 →</button></div>`}
function evening(){const e=C.NIGHT[state.day];return `<div class="content"><span class="tag gold">第 ${state.day+1} 天 · 夜间故事</span><h2 class="heading">${esc(e.title)}</h2><div class="story highlight">${esc(e.desc)}</div><p class="sub">这不是纯剧情选项。你的选择会改变下一天的资源或解锁延期收益。</p>${e.options.map((o,i)=>cardOption(i,o,'night',state.cash+(o.d.cash||0)>=0&&(!o.req||Object.entries(o.req).every(([k,v])=>state[k]>=v)))).join('')}</div>`}
function end(){const outcome=state.outcome,a=C.assets(state),net=outcome.net,badge=outcome.id==='legend'?'🏆':outcome.id==='saved'?'🌟':outcome.id==='fragile'?'🍃':'🌙';return `<div class="content"><span class="tag gold">七天经营终局</span><div class="endbig"><span class="badge-icon">${badge}</span><h2>${esc(outcome.title)}</h2><p>${esc(outcome.text)}</p></div><div class="summary-grid"><div class="sum-box"><small>期末现金</small><strong>${state.cash}</strong></div><div class="sum-box"><small>剩余库存价值</small><strong>${C.stockValue(state)}</strong></div><div class="sum-box"><small>库存折价可变现</small><strong>${C.liquidation(state)}</strong></div><div class="sum-box"><small>折价变现并还债后</small><strong>${net>=0?'+':''}${net}</strong></div></div><div class="story">七日还债目标：<b>${C.debt(state)} 金币</b>。库存按成本的八折模拟清算后，才能用于最后还债。口碑 <b>${state.rep}</b>，莉娅的信任 <b>${state.trust}</b>，名气 <b>${state.fame}</b>。<br/>已解锁 <b>${archive.length}/4</b> 种结局。</div><div class="panel"><div class="panel-title">七天经营流水</div><table class="score-table"><thead><tr><th>日期</th><th>来客</th><th>成交</th><th>销售额</th><th>余额</th></tr></thead><tbody>${state.reports.map(r=>`<tr><td>${r.day}</td><td>${r.customers}</td><td>${r.sold}</td><td>${r.revenue}</td><td>${r.cash}</td></tr>`).join('')}</tbody></table></div><div class="panel"><div class="panel-title">你做过的关键抉择</div><div class="log">${state.events.map(x=>`<p><b>第${x.day}夜：</b>${esc(x.choice)}<br/><span class="muted">${esc(x.result)}</span></p>`).join('')}</div></div><div class="actions end-replay"><button class="button full" data-act="restart">重新开始另一条人生 ↻</button><button class="button alt" data-act="export">导出最终存档</button></div><p class="small">本作当前是完整的七天剧情循环。未包含第八天及之后的无限经营，不能将本轮结局自动视为正式商业版内容量。</p></div>`}
function render(){const body=!state?titlePage():({morning,prepare,selling,report,evening,ending:end})[state.phase]();root.innerHTML=header()+statbar()+hero()+body+footer()}
function suggested(s){if(s.phase!=='prepare')throw Error('请先进入备货阶段');let n=s;const target=C.DAY[s.day].pool.reduce((a,x)=>((a[x[1]]=(a[x[1]]||0)+1),a),{});let wishes=Object.entries(target).sort((a,b)=>b[1]-a[1]);let guard=0;while(C.stockCount(n)<n.capacity&&guard++<22){let ordered=wishes.sort((a,b)=>(b[1]/(n.stock[b[0]]+1))-(a[1]/(n.stock[a[0]]+1)));let done=false;for(const [id] of ordered){if(n.cash>=C.cost(n,id)){n=C.purchase(n,id);done=true;break}}if(!done)break}return n}
function doExport(){if(!state)return notify('尚未开始游戏');try{let data=JSON.stringify({game:'星灯魔女咖啡馆',save:state,archive},null,2);const blob=new Blob([data],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`星灯魔女咖啡馆_第${state.day+1}天_存档.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),100);notify('存档已导出')}catch(e){notify('导出失败：'+e.message)}}
root.addEventListener('change',async(ev)=>{if(ev.target.id!=='starSaveInput'||!ev.target.files?.length)return;try{let data=JSON.parse(await ev.target.files[0].text());let restored=C.validate(data.save||data);state=restored;if(Array.isArray(data.archive))archive=[...new Set([...archive,...data.archive.filter(x=>typeof x==='string')])].slice(0,40);if(state.phase==='ending'&&state.outcome?.id&&!archive.includes(state.outcome.id))archive.push(state.outcome.id);save();render();document.documentElement.scrollTop=0;notify('存档读取成功')}catch(e){notify('存档无法读取：'+(e.message||'格式错误'))}});
root.addEventListener('click',ev=>{const btn=ev.target.closest('button[data-act]');if(!btn||btn.disabled)return;const action=btn.dataset.act,id=btn.dataset.id,i=Number(btn.dataset.i);switch(action){case'start':act(()=>C.newGame(),true);break;case'restart':if(window.confirm('重新开始将覆盖本局存档，已解锁结局会保留。确定吗？'))act(()=>C.newGame(),true);break;case'export':doExport();break;case'import':document.getElementById('starSaveInput')?.click();break;case'plan':act(s=>C.pickPlan(s,i),true);break;case'buy':act(s=>C.purchase(s,id));break;case'refund':act(s=>C.refund(s,id));break;case'priceUp':act(s=>C.setPrice(s,id,s.prices[id]+1));break;case'priceDown':act(s=>C.setPrice(s,id,s.prices[id]-1));break;case'suggest':act(s=>suggested(s));break;case'borrow':act(s=>C.emergencyBorrow(s));break;case'open':act(s=>C.openShop(s),true);break;case'serve':act(s=>C.serve(s));break;case'auto':act(s=>C.autoServe(s),true);break;case'upgrade':act(s=>C.upgrade(s,id));break;case'evening':act(s=>C.enterEvening(s),true);break;case'night':act(s=>C.nightChoice(s,i),true);break;}});
load();render();
window.StarCafeDebug={state:()=>state,archive:()=>archive};
})();
</script></body></html>
